[project]
name = "estudo-pyspark"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "delta-spark==4.0.0",
    "pandas==2.3.3",
    "pyarrow==21.0.0",
    "pyspark==4.0.1",
]

[dependency-groups]
dev = [
    "jupyterlab==4.4.9",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
